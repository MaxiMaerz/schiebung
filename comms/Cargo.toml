[package]
name = "comms"
version.workspace = true
edition = "2021"
description = "Client-server communication for schiebung transforms"
license = "MIT"
repository = "https://github.com/MaxiMaerz/schiebung"
documentation = "https://maximaerz.github.io/schiebung/"
homepage = "https://github.com/MaxiMaerz/schiebung"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
nalgebra = "0.33"
zenoh = "1.9"
tokio = { version = "1.42", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
schiebung.workspace = true
thiserror = "2.0"
hiroz = "0.1"
# Referenced by the code hiroz-codegen emits into OUT_DIR (`::hiroz_cdr`,
# `::byteorder`, `::bytemuck`), so they must be direct dependencies even though
# no hand-written code in this crate names them.
hiroz-cdr = "0.1"
byteorder = "1.3"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }

[build-dependencies]
hiroz-codegen = "0.1"
